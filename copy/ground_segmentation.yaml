curb_extraction_node:
  ros__parameters:
    use_sim_time: false
    debug_mode: true

    # 話題參數
    input_topic: "/camera1/depth/points"
    line_topic: "/camera1/extracted_line"
    path_topic: "/camera1/extracted_line_path"
    voxel_debug_topic: "/camera1/voxel_debug_cloud"
    x_passthrough_debug_topic: "/camera1/x_passthrough_debug_cloud"
    z_passthrough_topic: "/camera1/z_passthrough_cloud"
    vertical_points_topic: "/camera1/vertical_points_cloud"
    max_vertical_points_topic: "/camera1/max_vertical_points_cloud"
    line_points_topic: "/camera1/line_points_cloud"
    plane_points_topic: "/camera1/plane_points_cloud"

    global_frame: "base_footprint"

    # 滤波参数
    voxel_size_x: 0.05
    voxel_size_y: 0.02
    voxel_size_z: 0.05

    z_filter_min: 0.0
    z_filter_max: 0.2

    x_filter_min: 0.0
    x_filter_max: 5.0

    # 法向量估计参数
    normal_estimation_radius: 0.05
    vertical_angle_threshold: 70.0

    # 区域生长参数
    min_cluster_size: 50
    max_cluster_size: 100000
    curvature_threshold: 1.0
    residual_threshold: 0.05

    # RANSAC擬合直線方程參數
    ransac_distance_threshold: 0.01
    max_line_iterations: 50
    min_line_length: 0.5
    ransac_line_angle_threshold: 5.0

    # 歐式聚類點雲參數
    euclidean_cluster_tolerance: 0.1

    # 發佈Path話題參數
    path_sampling_interval: 1.0

    # 從垂直地面點雲中提取直線簇參數
    angle_threshold: 10.0
    search_radius: 0.2
    min_segment_size: 10

    # 卡尔曼滤波参数
    kalman_process_noise: 0.01
    kalman_measurement_noise: 0.1
    kalman_warmup_frames: 10
    kalman_no_line_timeout: 1.0
    kalman_line_distance_threshold: 0.5
    kalman_line_angle_threshold: 10.0
    enable_kalman_filter: true