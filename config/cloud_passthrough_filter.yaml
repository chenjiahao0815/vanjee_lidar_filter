cloud_passthrough_filter_node:
  ros__parameters:
    use_sim_time: true

    input_topic: "/vanjee/lidar"
    output_topic: "/vanjee/lidar_passthrough"

    filter_order: "xyz"
    enable_x: true
    enable_y: true
    enable_z: true

    # 原先按 front_ground_segmentation 的前方直通，和雷达中心立方体对不齐
    # limit_min_x: 0.0
    # limit_max_x: 3.5
    # limit_min_y: -2.0
    # limit_max_y: 2.0
    # limit_min_z: -0.2
    # limit_max_z: 0.4
    # 与立方体 4×4×2（|x|≤2, |y|≤2, |z|≤1）对齐
    limit_min_x: -8.0
    limit_max_x: 8.0
    limit_min_y: -8.0
    limit_max_y: 8.0
    limit_min_z: -2.0
    limit_max_z: 2.0

    debug_mode: true
    debug_topic_x: "/vanjee/passthrough_x"
    debug_topic_y: "/vanjee/passthrough_y"
    debug_topic_z: "/vanjee/passthrough_z"

    memory_pool_size: 10
    memory_pool_reserve: 1000000
    cloud_log_interval_sec: 1.0

    # 立方体
    cube_min_x: -2.5
    cube_max_x: 2.5
    cube_min_y: -2.5
    cube_max_y: 2.5
    cube_min_z: -1.0
    cube_max_z: 1.0

    removed_topic: "/vanjee/lidar_removed"
    enable_voxel_filter: true
    ang_h: 0.0034906585
    ang_v: 0.0174532925
    r_max: 8.0
    base_xy: 0.05
    base_z: 0.05
    max_xy: 2.0
    max_z: 2.0 
    size_z_min: 0.05

    size_xy_bands: "(1.0,3.0),(2.0,6.0),(3.0,14.0)"
    size_z_bands: "(0.0,3.0),(1.0,4.0),(2.0,8.0),(3.0,12.0)"
    size_z_ratio: 4.0

    thr_ratio: "(0.0,1.0),(1.0,0.7)"  # 越大删得越多  thr_z = line_gap x thr_ratio
    thr_z_min: 0.05

    # 聚类
    cluster_link_m: 0.18
    cluster_link_k: 6.0
    cluster_plane_k: 10.0

    min_cluster_points: 8
    # 体素删点后的小团清扫：对剩余点再聚类删碎片；很慢，默认关
    enable_small_cluster_filter: false

    # 平面拟合保护
    enable_plane_protect: true
    plane_protect_min_points: 80   # 越小越留
    plane_protect_rms_m: 0.07  # 原0.015拦不住本帧车体t2(rms≈0.069)；越小越严

    plane_protect_intensity: 10.0  # 团强度中位低于此值 → 不给豁免
    # 水平薄片否决豁免：|nz|>=此值 且 覆盖线数<=此值 → 当 pancake，回落厚度规则
    plane_protect_nz_min: 0.6
    plane_protect_max_rings: 10  # 越大越删  车


    # 红=删 青=平面保护留 绿=其它留 蓝=立方体无直通
    verdict_topic: "/vanjee/filter_verdict"
    boxes_topic: "/vanjee/filter_boxes"
    voxels_topic: "/vanjee/voxel_markers"
    voxels_deleted_topic: "/vanjee/voxel_markers_deleted"
    voxels_kept_topic: "/vanjee/voxel_markers_kept"
    publish_occupied_voxels: true
