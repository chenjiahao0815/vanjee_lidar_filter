cloud_passthrough_filter_node:
  ros__parameters:
    use_sim_time: true

    input_topic: "/vanjee/lidar"
    output_topic: "/vanjee/lidar_passthrough"

    filter_order: "xyz"
    enable_x: true
    enable_y: true
    enable_z: true

    # 原先按 front_ground_segmentation 的前方直通，和雷达中心立方体对不齐
    # limit_min_x: 0.0
    # limit_max_x: 3.5
    # limit_min_y: -2.0
    # limit_max_y: 2.0
    # limit_min_z: -0.2
    # limit_max_z: 0.4
    # 与立方体 4×4×2（|x|≤2, |y|≤2, |z|≤1）对齐
    limit_min_x: -8.0
    limit_max_x: 8.0
    limit_min_y: -8.0
    limit_max_y: 8.0
    limit_min_z: -2.0
    limit_max_z: 2.0

    debug_mode: true
    debug_topic_x: "/vanjee/passthrough_x"
    debug_topic_y: "/vanjee/passthrough_y"
    debug_topic_z: "/vanjee/passthrough_z"

    memory_pool_size: 10
    memory_pool_reserve: 1000000
    cloud_log_interval_sec: 1.0

    # 立方体
    cube_min_x: -2.5
    cube_max_x: 2.5
    cube_min_y: -2.5
    cube_max_y: 2.5
    cube_min_z: -1.0
    cube_max_z: 1.0

    removed_topic: "/vanjee/lidar_removed"
    enable_voxel_filter: true
    ang_h: 0.0034906585
    ang_v: 0.0174532925
    r_max: 8.0
    base_xy: 0.05
    base_z: 0.05
    max_xy: 1.0
    max_z: 1.0
    size_z_min: 0.05

    # r<1 ×1；[1,2)×2；[2,3.5)×3；≥3.5 ×4
    size_xy_bands: "(1.0,2.0),(2.0,3.0),(3.5,4.0)"
    size_z_ratio: 4.0

    thr_ratio: 2.0   # 越大删得越多
    thr_z_min: 0.07

    # 聚类
    cluster_link_m: 0.18
    cluster_link_k: 6.0
    cluster_plane_k: 10.0

    min_cluster_points: 8

    # 红=体素删掉 绿=两框交集里留下 蓝=进了立方体但没进直通
    verdict_topic: "/vanjee/filter_verdict"
    boxes_topic: "/vanjee/filter_boxes"
    voxels_topic: "/vanjee/voxel_markers"
    voxels_deleted_topic: "/vanjee/voxel_markers_deleted"
    voxels_kept_topic: "/vanjee/voxel_markers_kept"
    publish_occupied_voxels: true
