cloud_passthrough_filter_node:
  ros__parameters:
    use_sim_time: true

    input_topic: "/vanjee/lidar"
    output_topic: "/vanjee/lidar_passthrough"

    filter_order: "xyz"
    enable_x: true
    enable_y: true
    enable_z: true

    # 原先按 front_ground_segmentation 的前方直通，和雷达中心立方体对不齐
    # limit_min_x: 0.0
    # limit_max_x: 3.5
    # limit_min_y: -2.0
    # limit_max_y: 2.0
    # limit_min_z: -0.2
    # limit_max_z: 0.4
    # 与立方体 4×4×2（|x|≤2, |y|≤2, |z|≤1）对齐
    limit_min_x: -8.0
    limit_max_x: 8.0
    limit_min_y: -8.0
    limit_max_y: 8.0
    limit_min_z: -2.0
    limit_max_z: 2.0

    debug_mode: true
    debug_topic_x: "/vanjee/passthrough_x"
    debug_topic_y: "/vanjee/passthrough_y"
    debug_topic_z: "/vanjee/passthrough_z"

    memory_pool_size: 10
    memory_pool_reserve: 1000000
    cloud_log_interval_sec: 1.0

    # 我们自己的立方体，雷达中心，长宽高
    cube_length: 4.0
    cube_width: 4.0
    cube_height: 2.0

    # 细格 base；合成后横向=1×线间距，纵向=2×线间距
    removed_topic: "/vanjee/lidar_removed"
    enable_voxel_filter: true
    ang_h: 0.0034906585
    ang_v: 0.0174532925
    r_max: 8.0
    base_xy: 0.1
    base_z: 0.1
    max_xy: 0.5
    max_z: 0.5
    thr_ratio: 2.0
    # 近处 thr_z 绝对下限，避免贴雷达时门槛掉到几毫米
    # 和下面的 cluster_min_h 对齐：单格想凭厚度免死，也得有实物那么厚
    thr_z_min: 0.05
    # 连通团：三维下限 + 随距离放大；同高度再用更大的 XY 间距去接水平面
    cluster_link_m: 0.18
    cluster_link_k: 6.0
    cluster_plane_k: 10.0

    # 团保护先看物理高度：整团必须真的立起 cluster_min_h 才算实物，扁的一律毙
    # 线数门槛不再是定值，按 h/(r·ang_v) 折出来再两端夹住
    #   r < 2.29 m → 3 根线，r ≥ 2.29 m → 2 根线（启动日志会打这条曲线）
    # 上限只用来挡一两根线的飞点，压不住扁团，扁不扁交给 cluster_min_h
    cluster_min_h: 0.08
    min_cluster_rings: 2     # 最远处的下限
    max_cluster_rings: 3     # 非常近时的上限

    # 红=体素删掉 绿=两框交集里留下 蓝=进了立方体但没进直通
    verdict_topic: "/vanjee/filter_verdict"
    boxes_topic: "/vanjee/filter_boxes"
    voxels_topic: "/vanjee/voxel_markers"
    publish_occupied_voxels: true
