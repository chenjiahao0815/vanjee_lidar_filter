cloud_passthrough_filter_node:
  ros__parameters:
    use_sim_time: true

    input_topic: "/vanjee/lidar"
    output_topic: "/vanjee/lidar_passthrough"

    filter_order: "xyz"
    enable_x: true
    enable_y: true
    enable_z: true

    # 原先按 front_ground_segmentation 的前方直通，和雷达中心立方体对不齐
    # limit_min_x: 0.0
    # limit_max_x: 3.5
    # limit_min_y: -2.0
    # limit_max_y: 2.0
    # limit_min_z: -0.2
    # limit_max_z: 0.4
    # 与立方体 4×4×2（|x|≤2, |y|≤2, |z|≤1）对齐
    limit_min_x: -8.0
    limit_max_x: 8.0
    limit_min_y: -8.0
    limit_max_y: 8.0
    limit_min_z: -2.0
    limit_max_z: 2.0

    debug_mode: true
    debug_topic_x: "/vanjee/passthrough_x"
    debug_topic_y: "/vanjee/passthrough_y"
    debug_topic_z: "/vanjee/passthrough_z"

    memory_pool_size: 10
    memory_pool_reserve: 1000000
    cloud_log_interval_sec: 1.0

    # 立方体
    cube_min_x: -2.5
    cube_max_x: 2.5
    cube_min_y: -2.5
    cube_max_y: 2.5
    cube_min_z: -1.0
    cube_max_z: 1.0

    removed_topic: "/vanjee/lidar_removed"
    enable_voxel_filter: true
    ang_h: 0.0034906585
    ang_v: 0.0174532925
    r_max: 8.0
    base_xy: 0.05
    base_z: 0.05
    max_xy: 2.0
    max_z: 2.0
    size_z_min: 0.05

    # 双尺度：小格先删，大格用整云再判，小格删了但大格判留的点捞回
    size_xy_bands1: "(1.0,3.0),(2.0,6.0),(3.0,12.0)"   # 先删：4/8/12 倍
    size_xy_bands2: "(1.0,20.0),(2.0,22.0),(3.0,14.0)"  # 再捞：原大格
    size_z_bands: "(0.0,3.0),(1.0,4.0),(2.0,8.0),(3.0,12.0)"
    size_z_ratio: 4.0

    thr_ratio: "(0.0,1.0),(1.0,0.7)"  # 越大删得越多  thr_z = line_gap x thr_ratio
    thr_z_min: 0.05

    # 聚类
    cluster_link_m: 0.18
    cluster_link_k: 6.0
    cluster_plane_k: 10.0

    # 豁免发放模式：0=大格判留+ring门闩（原行为）；1=团级自证
    # 模式1 的动机：大格判"薄/留"看的是这块表面在 z 上有多陡，缓坡在 1m 格子里
    # 也只跨几厘米就会被判薄，它的点连候选池都进不去（实测一个真实缓坡 396/511
    # 个点卡在这）。改成按"小格连通团"发豁免：团覆盖的激光线数直接反映它是不是
    # 一条被多根线扫到的连续表面。
    restore_mode: 0

    # 模式1 参数
    cluster_min_rings: 4         # 团覆盖 ring 数下限。实测：近场薄片 2 条、
                                 # 真实缓坡 7~8 条、真实墙面 17 条，门槛 4 余量很大
    cluster_min_radius: 1.3      # 点自身径向 < 该值一律不豁免（近场是另一族伪影，
                                 # 现行逻辑删它 100% 且是对的）；0 = 关闭

    enable_line_restore_gate: true
    # ring 滑窗种子 + 向两侧生长（只卡大格捞回）
    line_gap_k: 2.0              # 邻点距 < k * r * ang_h（切段/生长共用）
    seed_win: 4                  # 种子窗口点数（短墙可试 3）
    seed_rms_m: 0.02             # 种子局部直线 RMS
    grow_pred_m: 0.05            # 生长：偏离当前直线预测的上限（米）
    grow_min_points: 3           # 长完至少这么多点才捞回

    # 红=体素删掉 青=大格捞回 绿=其它留下 蓝=进了立方体但没进直通
    verdict_topic: "/vanjee/filter_verdict"
    boxes_topic: "/vanjee/filter_boxes"
    voxels_topic: "/vanjee/voxel_markers"
    voxels_deleted_topic: "/vanjee/voxel_markers_deleted"
    voxels_kept_topic: "/vanjee/voxel_markers_kept"
    publish_occupied_voxels: true
